<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Película</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0"
                            th:text="${pelicula.id == null ? 'Registrar Nueva Película' : 'Editar Película'}"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/guardar}" th:object="${pelicula}" method="post">
                            <!-- Campo oculto para conservar el ID al editar -->
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Título de la Película:</label>
                                <input type="text" th:field="*{titulo}" class="form-control" placeholder="Ej. Inception"
                                    required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Género:</label>
                                <input type="text" th:field="*{genero}" class="form-control"
                                    placeholder="Ej. Ciencia Ficción" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Año de Estreno:</label>
                                <input type="number" th:field="*{anio}" class="form-control" placeholder="Ej. 2010"
                                    required />
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Director:</label>
                                <select th:field="*{director.id}" class="form-select" required>
                                    <option value="" disabled>-- Selecciona un Director --</option>
                                    <option th:each="dir : ${directores}" th:value="${dir.id}"
                                        th:text="${dir.nombre + ' (' + dir.nacionalidad + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
