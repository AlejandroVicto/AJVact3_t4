<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">

        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0 fw-bold text-dark">Catálogo de Películas</h2>
            <a th:href="@{/nuevo}" class="btn btn-primary">+ Nueva Película</a>
        </div>

        <!-- 1. Tabla de Películas -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold py-3 d-flex justify-content-between align-items-center">
                <span>Películas Registradas</span>
                <span class="badge bg-light text-secondary border" th:text="${#lists.size(peliculas)}">0</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">ID</th>
                                <th>Título</th>
                                <th>Género</th>
                                <th>Año</th>
                                <th>Director</th>
                                <th>Nacionalidad</th>
                                <th class="text-end pe-3">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(peliculas)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    No hay películas registradas.
                                </td>
                            </tr>
                            <tr th:each="peli : ${peliculas}">
                                <td class="ps-3 text-muted" th:text="${peli.id}"></td>
                                <td class="fw-semibold" th:text="${peli.titulo}"></td>
                                <td>
                                    <span class="badge bg-light text-dark border fw-normal"
                                        th:text="${peli.genero}"></span>
                                </td>
                                <td th:text="${peli.anio}"></td>
                                <td th:text="${peli.director != null ? peli.director.nombre : 'Sin director'}"></td>
                                <td th:text="${peli.director != null ? peli.director.nacionalidad : '-'}"></td>
                                <td class="text-end pe-3 text-nowrap">
                                    <a th:href="@{/editar/{id}(id=${peli.id})}"
                                        class="btn btn-outline-secondary btn-sm me-1">Editar</a>
                                    <a th:href="@{/eliminar/{id}(id=${peli.id})}" class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('¿Estás seguro de eliminar esta película?');">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2. Sección de Directores -->
        <div class="row g-4">
            <!-- Tabla de Directores -->
            <div class="col-md-7">
                <div class="card border-0 shadow-sm h-100">
                    <div
                        class="card-header bg-white fw-semibold py-3 d-flex justify-content-between align-items-center">
                        <span>Directores</span>
                        <span class="badge bg-light text-secondary border" th:text="${#lists.size(directores)}">0</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">ID</th>
                                        <th>Nombre</th>
                                        <th class="pe-3">Nacionalidad</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(directores)}">
                                        <td colspan="3" class="text-center text-muted py-4">
                                            No hay directores registrados.
                                        </td>
                                    </tr>
                                    <tr th:each="dir : ${directores}">
                                        <td class="ps-3 text-muted" th:text="${dir.id}"></td>
                                        <td class="fw-medium" th:text="${dir.nombre}"></td>
                                        <td class="pe-3" th:text="${dir.nacionalidad}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulario Agregar Director -->
            <div class="col-md-5">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white fw-semibold py-3">
                        Agregar Director
                    </div>
                    <div class="card-body">
                        <form th:action="@{/directores/guardar}" th:object="${nuevoDirector}" method="post">
                            <div class="mb-3">
                                <label for="nombreDirector" class="form-label">Nombre</label>
                                <input type="text" id="nombreDirector" th:field="*{nombre}" class="form-control"
                                    placeholder="Ej. Martin Scorsese" required>
                            </div>
                            <div class="mb-3">
                                <label for="nacionalidadDirector" class="form-label">Nacionalidad</label>
                                <input type="text" id="nacionalidadDirector" th:field="*{nacionalidad}"
                                    class="form-control" placeholder="Ej. Estadounidense" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
